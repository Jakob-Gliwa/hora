name: CI

# Checks gate fork images on main and release tags. Pull requests never publish.
# Documentation changes do not build or deploy anything.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "brand/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "brand/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    # A hung mirror or test must fail fast, not hold the run for GitHub's 6 h.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The runner image ships cmake and clang; apt only runs for what is
      # missing, with short timeouts, so a hanging Ubuntu mirror cannot stall CI.
      - name: Install build dependencies (aws-lc-rs)
        timeout-minutes: 5
        run: |
          missing=""
          command -v cmake >/dev/null || missing="$missing cmake"
          command -v clang >/dev/null || missing="$missing clang"
          ldconfig -p | grep -q libclang || missing="$missing libclang-dev"
          if [ -z "$missing" ]; then echo "cmake, clang and libclang present"; exit 0; fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y $missing
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Migration tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: MQTT broker integration
        run: scripts/test-mqtt.sh

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Compile and smoke-test alongside check/deny. No registry write permission.
  # Only the publish job below may update an Unraid image, after all gates pass.
  docker:
    if: github.repository == 'Jakob-Gliwa/hora' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.binary.outputs.artifact-id }}
    env:
      RUST_IMAGE: rust:1.99.1-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Registry and target dir of the Alpine build; the key rolls per commit so
      # the cache keeps up with dependency changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo-musl/registry/index
            ~/.cargo-musl/registry/cache
            target-musl
          key: musl-${{ env.RUST_IMAGE }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            musl-${{ env.RUST_IMAGE }}-${{ hashFiles('Cargo.lock') }}-
            musl-${{ env.RUST_IMAGE }}-
      # Alpine's native Rust target is musl: a fully static binary for the
      # Alpine runtime image, built on the native amd64 runner (no QEMU).
      - name: Build static musl release binary
        run: |
          mkdir -p ~/.cargo-musl/registry
          docker run --rm -v "$PWD:/src" -v "$HOME/.cargo-musl/registry:/usr/local/cargo/registry" \
            -w /src -e UID_GID="$(id -u):$(id -g)" "$RUST_IMAGE" sh -euc '
              apk add --no-cache musl-dev linux-headers cmake make perl clang clang-dev >/dev/null
              trap "chown -R \$UID_GID target-musl /usr/local/cargo/registry" EXIT
              cargo build --release --locked -p hora --target-dir target-musl'
          file target-musl/release/hora | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          mkdir -p "$RUNNER_TEMP/hora-image"
          cp target-musl/release/hora "$RUNNER_TEMP/hora-image/hora"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/hora-image
          file: Dockerfile
          build-args: BUILD_MODE=prebuilt
          platforms: linux/amd64
          load: true
          tags: hora:smoke
      - name: Smoke test built binary
        run: bash scripts/smoke-container.sh hora:smoke
      - name: Share tested binary with publish job
        id: binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hora-linux-amd64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hora-image/hora
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  publish:
    needs: [check, deny, docker]
    if: github.repository == 'Jakob-Gliwa/hora' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.docker.outputs.artifact-id }}
          path: ${{ runner.temp }}/hora-image
          merge-multiple: true
      # Artifact archives do not retain executable permissions.
      - run: chmod 755 "$RUNNER_TEMP/hora-image/hora"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/hora-image
          file: Dockerfile
          build-args: BUILD_MODE=prebuilt
          platforms: linux/amd64
          load: true
          tags: hora:smoke
      # This runner assembles the runtime again: test that image too, so a
      # changed base layer cannot reach main merely because the binary passed.
      - name: Smoke test before publishing
        run: bash scripts/smoke-container.sh hora:smoke
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jakob-gliwa/hora
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long
      # Same context and builder as the tested image; the layers come from the
      # builder's cache, so this only adds attestations and pushes.
      - name: Push tested image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/hora-image
          file: Dockerfile
          build-args: BUILD_MODE=prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain metadata attached to the image: build provenance and an SBOM.
          provenance: mode=max
          sbom: true
