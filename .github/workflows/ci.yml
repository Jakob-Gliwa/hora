name: CI

# Checks gate fork images on main and release tags. Pull requests never publish.
# Version tags additionally publish a GitHub release.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install build dependencies (aws-lc-rs)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Migration tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: MQTT broker integration
        run: scripts/test-mqtt.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Build and publish the personal fork after checks, on main and release tags.
  # RustSec advisory scanning lives in audit.yml (path-filtered + scheduled);
  # releases stay gated on advisories regardless, since `deny` checks the same
  # database on every run.
  docker:
    needs: [check, deny]
    if: github.repository == 'Jakob-Gliwa/hora' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jakob-gliwa/hora
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain metadata attached to the image: build provenance and an SBOM.
          provenance: mode=max
          sbom: true

      - name: Smoke test published image
        env:
          IMAGE: ghcr.io/jakob-gliwa/hora:sha-${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/hora-smoke"
          printf '[page]\n[server]\n' > "$RUNNER_TEMP/hora-smoke/config.toml"
          chmod 755 "$RUNNER_TEMP/hora-smoke"
          chmod 644 "$RUNNER_TEMP/hora-smoke/config.toml"
          docker run -d --name hora-smoke --network none \
            -v "$RUNNER_TEMP/hora-smoke/config.toml:/etc/hora/config.toml:ro" "$IMAGE"
          trap 'docker rm -fv hora-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec hora-smoke wget -qO /dev/null http://127.0.0.1:8787/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs hora-smoke
          exit 1

  # Publish the GitHub release once the image is out, with notes from CHANGELOG.md.
  release:
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          changelog: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
